name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Backend: Build & Test ──────────────────────────────────────
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homebase_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: homebase-backend
        env:
          SPRING_PROFILES_ACTIVE: prod
          DATABASE_URL: jdbc:postgresql://localhost:5432/homebase_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: testpass
          JWT_SECRET: homebase-ci-test-secret-key-minimum-32chars
        run: mvn test -B

  # ── Frontend: Build ────────────────────────────────────────────
  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: homebase-frontend/package-lock.json

      - name: Install dependencies
        working-directory: homebase-frontend
        run: npm ci

      - name: Build
        working-directory: homebase-frontend
        run: npm run build

  # ── Deploy: only on push to main after CI passes ───────────────
  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR: 938533114375.dkr.ecr.us-east-2.amazonaws.com
        run: |
          docker build -t $ECR/homebase-backend:latest ./homebase-backend
          docker push $ECR/homebase-backend:latest

      - name: Build and push frontend image
        env:
          ECR: 938533114375.dkr.ecr.us-east-2.amazonaws.com
        run: |
          docker build -t $ECR/homebase-frontend:latest ./homebase-frontend
          docker push $ECR/homebase-frontend:latest

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster homebase \
            --service homebase-backend \
            --force-new-deployment \
            --region us-east-2

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster homebase \
            --service homebase-frontend \
            --force-new-deployment \
            --region us-east-2

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster homebase \
            --services homebase-backend homebase-frontend \
            --region us-east-2
