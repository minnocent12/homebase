server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # AWS VPC DNS resolver — required to resolve upstream hostnames dynamically
    resolver 169.254.169.253 valid=10s;

    # Proxy API calls to backend via ALB (set $var prevents startup DNS failure)
    location /api/ {
        set $backend "http://homebase-alb-2128858486.us-east-2.elb.amazonaws.com";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Handle React Router — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}